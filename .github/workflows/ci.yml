name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      # Full history. Several checks here ask an ancestry question, and a
      # shallow clone answers it WRONGLY rather than refusing: `git merge-base
      # --is-ancestor` exits non-zero for a commit outside the graft window,
      # which is byte-identical to "not an ancestor".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm test
