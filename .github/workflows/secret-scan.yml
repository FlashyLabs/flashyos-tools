# Secret scanning — blocks a newly committed credential before it lands.
#
# Scans the working tree (not git history) with a pinned gitleaks, so it fails
# on a NEW secret without tripping over already-known historical values pending
# rotation. A repository that ships public test fixtures or conformance vectors
# (public contract addresses, throwaway test keys) marks them reviewed in a
# committed `.gitleaksignore`, which gitleaks reads by default — those are
# public signatures, not credentials.
name: secret-scan
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run gitleaks (working tree)
        run: |
          set -euo pipefail
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner --exit-code 1
